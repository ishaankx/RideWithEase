<!DOCTYPE html>
<html>
<head>
    <title>RideWithEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .role-card { width: 300px; padding: 30px; margin: 20px; text-align: center; cursor: pointer; transition: 0.3s; }
        .role-card:hover { transform: scale(1.05); shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container d-flex justify-content-center">
        <div class="card role-card bg-primary text-white" onclick="selectRole('CUSTOMER')">
            <h3>Book a Ride</h3>
            <p>For Passengers</p>
        </div>
        <div class="card role-card bg-dark text-white" onclick="selectRole('DRIVER')">
            <h3>Driver</h3>
            <p>For Captains</p>
        </div>
    </div>
    <script>
        function selectRole(role) {
            localStorage.setItem("selectedRole", role);
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
